<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">A rules file your agent obeys</title>
<desc id="desc">You write the rules of your agent in one governance file, SOUL.md. A scan finds each rule and gives a score and a conformance level. The scan checks the file, not the running agent.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="400" fill="#f5f5f5"/>
<text x="40" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">A rules file your agent obeys</text>
<text x="40" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">OASB-2: THE AGENT BEHAVIORAL GOVERNANCE SPECIFICATION</text>
<rect x="40" y="140" width="232" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="48" y="148" width="30" height="16" rx="4" fill="#ececec"/>
<text x="63.0" y="160" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="156.0" y="172.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Write the rules</text>
<text x="156.0" y="186.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">what it can do</text>
<text x="156.0" y="198.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">what it must never do</text>
<rect x="336" y="140" width="232" height="84" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="344" y="148" width="36" height="16" rx="4" fill="#ececec"/>
<text x="362.0" y="160" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">FILE</text>
<text x="452.0" y="172.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">SOUL.md</text>
<text x="452.0" y="186.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">the governance file</text>
<text x="452.0" y="198.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">9 domains, 72 controls</text>
<rect x="632" y="140" width="232" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="640" y="148" width="36" height="16" rx="4" fill="#ececec"/>
<text x="658.0" y="160" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">SCAN</text>
<text x="748.0" y="172.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Scan the file</text>
<text x="748.0" y="186.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">finds each rule</text>
<text x="748.0" y="198.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">gives a score</text>
<rect x="928" y="140" width="232" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="936" y="148" width="48" height="16" rx="4" fill="#ececec"/>
<text x="960.0" y="160" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">RESULT</text>
<text x="1044.0" y="172.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Conformance level</text>
<text x="1044.0" y="186.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">Essential, Standard</text>
<text x="1044.0" y="198.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">or Hardened</text>
<line x1="276" y1="182.0" x2="330" y2="182.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="572" y1="182.0" x2="626" y2="182.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="868" y1="182.0" x2="922" y2="182.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<text x="600" y="272" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75">THE SCAN CHECKS THE FILE, NOT THE RUNNING AGENT.</text>
<line x1="40" y1="310" x2="1160" y2="310" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="40" y="336" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">KEY</text>
<rect x="160" y="324" width="30" height="16" rx="4" fill="#ececec"/>
<text x="175.0" y="336" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="200" y="336" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">a step you do</text>
<rect x="410" y="324" width="36" height="16" rx="4" fill="#ececec"/>
<text x="428.0" y="336" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">FILE</text>
<text x="456" y="336" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">the governance file</text>
<rect x="660" y="324" width="36" height="16" rx="4" fill="#ececec"/>
<text x="678.0" y="336" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">SCAN</text>
<text x="706" y="336" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">a tool checks it</text>
<rect x="910" y="324" width="48" height="16" rx="4" fill="#ececec"/>
<text x="934.0" y="336" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">RESULT</text>
<text x="968" y="336" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">what you get</text>
</svg>
