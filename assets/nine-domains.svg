<text x="218.0" y="330.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">says when it is not sure</text>
<rect x="422" y="284" width="356" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="430" y="292" width="30" height="16" rx="4" fill="#ececec"/>
<text x="445.0" y="304" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">D18</text>
<text x="600.0" y="316.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Human Oversight</text>
<text x="600.0" y="330.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">asks before it acts</text>
<rect x="804" y="284" width="356" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="812" y="292" width="30" height="16" rx="4" fill="#ececec"/>
<text x="827.0" y="304" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">D19</text>
<text x="982.0" y="316.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Harm Avoidance</text>
<text x="982.0" y="330.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">checks risk before acting</text>
