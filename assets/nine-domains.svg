<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Nine areas of behavior</title>
<desc id="desc">OASB-2 sorts 72 controls into nine domains: trust hierarchy, capability boundaries, injection hardening, data handling, hardcoded behaviors, agentic safety, honesty and transparency, human oversight and harm avoidance. Injection hardening and hardcoded behaviors contain the CRITICAL controls.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="470" fill="#f5f5f5"/>
<text x="40" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">Nine areas of behavior</text>
<text x="40" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">72 CONTROLS IN 9 DOMAINS</text>
