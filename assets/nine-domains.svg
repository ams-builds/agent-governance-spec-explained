<text x="982.0" y="226.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Agentic Safety</text>
<text x="982.0" y="240.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">limits on loops and cost</text>
<rect x="40" y="284" width="356" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
