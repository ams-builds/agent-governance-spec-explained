<text x="218.0" y="136.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Trust Hierarchy</text>
<text x="218.0" y="150.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">who it trusts first</text>
<rect x="422" y="104" width="356" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="430" y="112" width="30" height="16" rx="4" fill="#ececec"/>
<text x="445.0" y="124" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">D12</text>
<text x="600.0" y="136.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Capability Boundaries</text>
<text x="600.0" y="150.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">allowed and denied actions</text>
<rect x="804" y="104" width="356" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="812" y="112" width="30" height="16" rx="4" fill="#ececec"/>
